<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Moved &mdash; confirmation page</title>

<!--
  Compatibility shim. This site used to be served from a project repo, so
  every URL carried an /events-manager/ prefix. That prefix is baked into
  booking emails already sitting in people's inboxes, which cannot be
  edited after the fact — so these paths still resolve and forward to
  where the page actually lives now.

  Do not delete this folder while any email carrying the old links could
  still be opened. The banner image beside it is a real copy, not a
  redirect: an email client fetching an <img> follows no meta refresh.
-->

<meta http-equiv="refresh" content="0; url=../confirmed.html">
<link rel="canonical" href="../confirmed.html">
<script>window.location.replace('../confirmed.html' + window.location.search);</script>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #edf1f5;
    color: #12212e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }
  a { color: #003c6c; }
</style>
</head>
<body>

</body>
