<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arts Division Room Reservations</title>

<!--
  Every space lives in its own folder — panetta, darc — so the paths back up
  to the shared files (reservation.js, confirmed.html, assets/) are the same
  in each and a copied page cannot get them subtly wrong. The /reservations/
  in the public URL comes from the repository name, not from a folder here.

  This page is what /reservations/ itself serves. It forwards to Panetta,
  which is what older booking emails pointing at the bare site root mean by
  it. The redirect is a meta refresh plus a script — GitHub Pages has no
  server-side redirects — with a real link behind it for anyone the redirect
  does not carry.

  If a landing page listing every space is ever wanted, this is the file to
  replace; the conflict and invalid emails point at panetta/ directly, so
  only older mail would land here.
-->

<meta http-equiv="refresh" content="0; url=panetta/">
<link rel="canonical" href="panetta/">
<script>window.location.replace('panetta/' + window.location.search);</script>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #edf1f5;
    color: #12212e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
  }
  a { color: #003c6c; }
</style>
</head>
<body>
  <p>Taking you to the <a href="panetta/">Panetta Conference Room booking form</a>&hellip;</p>
</body>
</html>
