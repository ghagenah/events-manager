<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Calendar">
  <!--
    Solid shapes with cut-out days rather than thin strokes: at 16px in a tab a
    1px outline disappears. Four chunky days rather than a 3x2 grid for the
    same reason — smaller blocks merge into a smudge at tab size.

    The plate lightens in dark mode. UCSC Primary Blue is dark enough to vanish
    against a dark tab strip, and a favicon has no page behind it to borrow
    contrast from.
  -->
  <style>
    .plate { fill: #003c6c; }
    .day   { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #6ea8d4; }
      .day   { fill: #0e1c28; }
    }
  </style>

  <!-- binding rings -->
  <rect class="plate" x="8"  y="1" width="4" height="7" rx="2"/>
  <rect class="plate" x="20" y="1" width="4" height="7" rx="2"/>

  <!-- body, and the header band cut out of it -->
  <rect class="plate" x="2" y="4"  width="28" height="27" rx="5"/>
  <rect class="day"   x="2" y="12" width="28" height="2"/>

  <!-- days -->
  <rect class="day" x="7"  y="18" width="7" height="5" rx="1.5"/>
  <rect class="day" x="18" y="18" width="7" height="5" rx="1.5"/>
  <rect class="day" x="7"  y="25" width="7" height="4" rx="1.5"/>
  <rect class="day" x="18" y="25" width="7" height="4" rx="1.5"/>
</svg>
